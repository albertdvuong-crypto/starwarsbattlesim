<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Combat Simulation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="advanced-stats" class="hidden">
        <div class="stat-col purple-stats">
            <strong>Team Purple</strong>
            <div>TIEs: <span id="p-tie-c">0</span> / 750</div>
            <div>SDs: <span id="p-sd-c">0</span> / 50</div>
            <div>DSs: <span id="p-ds-c">0</span></div>
            <div>SKBs: <span id="p-skb-c">0</span></div>
        </div>
        <div class="stat-col brown-stats">
            <strong>Team Brown</strong>
            <div>TIEs: <span id="b-tie-c">0</span> / 750</div>
            <div>SDs: <span id="b-sd-c">0</span> / 50</div>
            <div>DSs: <span id="b-ds-c">0</span></div>
            <div>SKBs: <span id="b-skb-c">0</span></div>
        </div>
    </div>

    <div id="ui-container">
        <h1>Galactic Simulator</h1>
        
        <div class="controls">
            <button id="btn-mode-a" class="active">Mode A: Deep Space</button>
            <button id="btn-mode-b">Mode B: Planetary Orbit</button>
        </div>

        <div id="setup-panel">
            <div id="planet-setup" class="hidden">
                <label>Planet Defender: 
                    <select id="planet-team">
                        <option value="Purple">Team Purple</option>
                        <option value="Brown">Team Brown</option>
                    </select>
                </label>
            </div>

            <div class="team-setup purple-team">
                <h3>Team Purple (Left)</h3>
                <label>Starkiller Bases: <input type="number" id="p-skb" value="1" min="0" max="5"></label>
                <label>Death Stars: <input type="number" id="p-ds" value="2" min="0" max="10"></label>
                <label>Star Destroyers: <input type="number" id="p-sd" value="10" min="0" max="50"></label>
                <label>TIE Fighters: <input type="number" id="p-tie" value="50" min="0" max="200"></label>
            </div>
            
            <div class="team-setup brown-team">
                <h3>Team Brown (Right)</h3>
                <label>Starkiller Bases: <input type="number" id="b-skb" value="0" min="0" max="5"></label>
                <label>Death Stars: <input type="number" id="b-ds" value="3" min="0" max="10"></label>
                <label>Star Destroyers: <input type="number" id="b-sd" value="15" min="0" max="50"></label>
                <label>TIE Fighters: <input type="number" id="b-tie" value="70" min="0" max="200"></label>
            </div>
            
            <button id="btn-run">INITIATE BATTLE</button>
        </div>

        <button id="btn-modify" class="hidden">Modify Fleet</button>

        <div id="stats" class="hidden">
            <p><strong>Mode:</strong> <span id="mode-display">Deep Space Battle</span></p>
            <p><strong>Purple Fleet Total:</strong> <span id="count-purple">0</span></p>
            <p><strong>Brown Fleet Total:</strong> <span id="count-brown">0</span></p>
        </div>
    </div>
    
    <canvas id="sim-canvas"></canvas>

    <script src="entities.js"></script>
    <script src="main.js"></script>
</body>
</html>
