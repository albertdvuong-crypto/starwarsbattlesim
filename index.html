<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Combat Simulation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="ui-container">
        <h1>Galactic Simulator</h1>
        
        <div class="controls">
            <button id="btn-mode-a" class="active">Mode A: Deep Space</button>
            <button id="btn-mode-b">Mode B: Planetary Orbit</button>
        </div>

        <div id="setup-panel">
            <div id="planet-setup" class="hidden">
                <label>Planet Defender: 
                    <select id="planet-team">
                        <option value="Purple">Team Purple</option>
                        <option value="Brown">Team Brown</option>
                        <option value="Pink">Team Pink</option>
                        <option value="LightBrown">Team Light Brown</option>
                    </select>
                </label>
            </div>

            <div class="team-setup" style="border-left: 4px solid #9b59b6;">
                <h3><input type="checkbox" id="active-purple" class="team-toggle" checked> Team Purple</h3>
                <label>Alliance: 
                    <select id="alliance-purple">
                        <option value="1">Side 1</option>
                        <option value="2">Side 2</option>
                    </select>
                </label>
                <label>Starkiller Bases: <input type="number" id="purple-skb" value="0" min="0"></label>
                <label>Death Stars: <input type="number" id="purple-ds" value="0" min="0"></label>
                <label>Star Destroyers: <input type="number" id="purple-sd" value="0" min="0"></label>
                <label>TIE Fighters: <input type="number" id="purple-tie" value="0" min="0"></label>
            </div>
            
            <div class="team-setup" style="border-left: 4px solid #a0522d;">
                <h3><input type="checkbox" id="active-brown" class="team-toggle" checked> Team Brown</h3>
                <label>Alliance: 
                    <select id="alliance-brown">
                        <option value="1">Side 1</option>
                        <option value="2" selected>Side 2</option>
                    </select>
                </label>
                <label>Starkiller Bases: <input type="number" id="brown-skb" value="0" min="0"></label>
                <label>Death Stars: <input type="number" id="brown-ds" value="0" min="0"></label>
                <label>Star Destroyers: <input type="number" id="brown-sd" value="0" min="0"></label>
                <label>TIE Fighters: <input type="number" id="brown-tie" value="0" min="0"></label>
            </div>

            <div class="team-setup" style="border-left: 4px solid #ffb6c1;">
                <h3><input type="checkbox" id="active-pink" class="team-toggle"> Team Pink</h3>
                <label>Alliance: 
                    <select id="alliance-pink">
                        <option value="1">Side 1</option>
                        <option value="2">Side 2</option>
                    </select>
                </label>
                <label>Starkiller Bases: <input type="number" id="pink-skb" value="0" min="0"></label>
                <label>Death Stars: <input type="number" id="pink-ds" value="0" min="0"></label>
                <label>Star Destroyers: <input type="number" id="pink-sd" value="0" min="0"></label>
                <label>TIE Fighters: <input type="number" id="pink-tie" value="0" min="0"></label>
            </div>

            <div class="team-setup" style="border-left: 4px solid #d2b48c;">
                <h3><input type="checkbox" id="active-lightbrown" class="team-toggle"> Team Light Brown</h3>
                <label>Alliance: 
                    <select id="alliance-lightbrown">
                        <option value="1">Side 1</option>
                        <option value="2" selected>Side 2</option>
                    </select>
                </label>
                <label>Starkiller Bases: <input type="number" id="lightbrown-skb" value="0" min="0"></label>
                <label>Death Stars: <input type="number" id="lightbrown-ds" value="0" min="0"></label>
                <label>Star Destroyers: <input type="number" id="lightbrown-sd" value="0" min="0"></label>
                <label>TIE Fighters: <input type="number" id="lightbrown-tie" value="0" min="0"></label>
            </div>
            
            <button id="btn-run">INITIATE BATTLE</button>
        </div>

        <button id="btn-modify" class="hidden">Modify Fleet</button>
    </div>
    
    <canvas id="sim-canvas"></canvas>

    <script src="entities.js"></script>
    <script src="main.js"></script>
</body>
</html>
